syntax = "proto3";

package file;

option go_package = "github.com/Cheasezz/fileService/proto/fileService/;file";
option optimize_for = SPEED;

service File {
  rpc Upload(stream UploadReq) returns (UploadResp);
  rpc Download(FileInfo) returns (stream Chunk);
}

message UploadReq {
  oneof payload {
    FileInfo info = 1;
    Chunk chunk = 2;
  }
}

message FileInfo {
  string client_uuid = 1;
  string name = 2;
}

message Chunk {
  bytes data = 1;
}

message UploadResp {
  string name = 1;
  uint64 size = 2;
}

