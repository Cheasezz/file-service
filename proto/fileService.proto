syntax = "proto3";

package file;

option go_package = "github.com/Cheasezz/fileService/proto/fileService/;file";

service File {
  rpc Upload(stream UploadReq) returns (UploadResp);
  rpc Download(FileInfo) returns (stream Chunk);
  rpc GetAllFilesNames(Client) returns (Files);
  rpc CheckFiles(stream CheckFilesReq) returns (stream SyncDecision);
}

message UploadReq {
  oneof payload {
    FileInfo info = 1;
    Chunk chunk = 2;
  }
}

message FileInfo {
  Client client = 1;
  string name = 2;
}

message Client {
  string uuid = 1;
}

message CheckFilesReq {
  oneof payload {
    Client client = 1;
    FileMeta meta = 2;
  }
}

message FileMeta {
  string name = 1;
  string path = 2;
  bytes hash = 3;
}

message Chunk {
  bytes data = 1;
}

message UploadResp {
  string name = 1;
  uint64 size = 2;
}

message Files {
  repeated string names = 1;
}

message SyncDecision {
  string filename = 1;
  string filepath = 2;
  bool need_upload = 3;
}
